<svg width="48" height="44" viewBox="0 0 48 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark leather background gradient -->
    <linearGradient id="leatherNorm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281d14"/>
      <stop offset="50%" stop-color="#1b120b"/>
      <stop offset="100%" stop-color="#140d07"/>
    </linearGradient>
    <!-- Antique bronze border gradient -->
    <linearGradient id="bronzeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e5025"/>
      <stop offset="50%" stop-color="#9e7336"/>
      <stop offset="100%" stop-color="#593f1c"/>
    </linearGradient>
    <filter id="shadow" x="-4" y="-2" width="56" height="48" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Bookmark plaque with arrow / bookmark notch pointing right -->
    <path d="M4 4C4 2.89543 4.89543 2 6 2H38L44 22L38 42H6C4.89543 42 4 41.1046 4 40V4Z" 
          fill="url(#leatherNorm)" 
          stroke="url(#bronzeBorder)" 
          stroke-width="1.5"/>
    
    <!-- Inner subtle inset rim -->
    <path d="M7 6H36L41 22L36 38H7V6Z" 
          fill="none" 
          stroke="#422f17" 
          stroke-width="0.8" 
          stroke-dasharray="2 1"/>

    <!-- Left side binding rivets -->
    <circle cx="7" cy="7" r="1.2" fill="#785628" stroke="#140d07" stroke-width="0.5"/>
    <circle cx="7" cy="37" r="1.2" fill="#785628" stroke="#140d07" stroke-width="0.5"/>
  </g>
</svg>
